name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name (type/short-description)
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          pattern='^(feature|fix|hotfix|refactor|test|docs|chore)/[a-z0-9][a-z0-9._-]*$'
          if [[ ! "$HEAD_REF" =~ $pattern ]]; then
            echo "::error::Branch '$HEAD_REF' must look like type/short-description (feature, fix, hotfix, refactor, test, docs, chore), lowercase."
            exit 1
          fi

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Check for model changes without a migration
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes \
            --project src/FeriaAcademica.Infrastructure \
            --startup-project src/FeriaAcademica.Api
